<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Servicios notariales — Notaría Sultán-Zulueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
%%BASECSS%%
/* ---- servicios ---- */
.hero{position:relative;isolation:isolate;overflow:hidden;background:#002034;color:#fff;padding:calc(74px + clamp(2rem,4.5vw,3.4rem)) 0 clamp(2.2rem,4.5vw,3.4rem)}
.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--bg,none) center/cover}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,24,40,.94) 0%,rgba(0,24,40,.8) 45%,rgba(0,24,40,.45) 100%),linear-gradient(180deg,rgba(0,24,40,.5),transparent 30%,rgba(0,24,40,.55))}
.hero .crumb{margin-bottom:1.6rem}
.crumb{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.crumb a{color:var(--sky);text-decoration:none}.crumb a:hover{color:#fff}
.crumb i{font-style:normal;color:rgba(255,255,255,.5)}.crumb em{font-style:normal;color:rgba(255,255,255,.75)}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;align-items:center}
.hero h1{color:#fff;font-size:clamp(2.3rem,6vw,4.4rem);margin:0 0 1.1rem;letter-spacing:-.01em}
.hero p.in{margin:0;max-width:60ch;color:rgba(255,255,255,.86);font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.7}
.hero .acts{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem}
.btn.ghost{border:1px solid rgba(255,255,255,.5);color:#fff}.btn.ghost:hover{background:#fff;color:var(--navy)}
.hico:empty{display:none}.hico{width:clamp(130px,17vw,210px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45));animation:fl 6s ease-in-out infinite}
.hico img{width:100%;height:auto;display:block}
.hico svg{width:62%;height:auto;stroke:#fff;fill:none;stroke-width:1.2}
@keyframes fl{50%{transform:translateY(-10px)}}
.facts{display:flex;flex-wrap:wrap;gap:.5rem 2rem;margin-top:clamp(1.8rem,3vw,2.6rem);padding-top:.9rem;border-top:1px solid rgba(255,255,255,.3);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.75)}
@media(max-width:700px){.hgrid{grid-template-columns:1fr}.hico{position:absolute;right:12px;top:calc(74px + 3.4rem);width:84px;opacity:.95;animation:none}.hero:after{background:linear-gradient(180deg,rgba(0,24,40,.9),rgba(0,24,40,.78) 60%,rgba(0,24,40,.92))}}
/* conmutador de servicios */
.sw{position:sticky;top:calc(74px + env(safe-area-inset-top,0px));z-index:15;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
@media(max-width:700px){.sw{position:static}}
.sw .chips{padding-block:.8rem;margin:0}
.chip.me{display:flex;align-items:center;gap:.5rem}
.chip.me img{width:22px;height:22px;object-fit:contain}
.chip{text-decoration:none}
.chips{position:relative;display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:.38rem .95rem;font-size:.84rem;font-weight:500;transition:.2s;white-space:nowrap}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip[aria-current=page]{background:var(--blue);border-color:var(--blue);color:#fff}
/* explorador */
.ex{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:start;padding-block:clamp(1.8rem,4vw,3.2rem)}
.ex.solo{grid-template-columns:1fr}
.ex.solo .tl{display:none}
.ex.solo .det{max-width:820px;margin-inline:auto;width:100%}
.tl{position:sticky;top:calc(74px + 76px);min-width:0}
.tl .lab{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--navy);padding-bottom:.7rem;border-bottom:2px solid var(--navy);display:flex;justify-content:space-between}
.tl .lab span{color:var(--mute)}
.tsearch{position:relative;margin:.9rem 0 .3rem}
.tsearch input{width:100%;height:42px;border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:0 .8rem;font:400 .95rem 'Source Sans 3',sans-serif;color:var(--navy)}
.tsearch input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(12,77,162,.12)}
.tsearch input::-webkit-search-cancel-button{-webkit-appearance:none}
.tl ul{list-style:none;margin:0;padding:0;max-height:calc(100vh - 260px);overflow:auto}
.tl li button{display:grid;grid-template-columns:2rem 1fr;gap:.4rem;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:.8rem .5rem .8rem .1rem;color:var(--ink);font-size:.98rem;line-height:1.35;position:relative;transition:.2s}
.tl li button b{font:500 .78rem 'Source Sans 3';letter-spacing:.1em;color:var(--mute)}
.tl li button:hover{color:var(--blue);padding-left:.4rem}
.tl li button[aria-current=true]{color:var(--navy);font-weight:600;background:linear-gradient(90deg,rgba(12,77,162,.08),transparent)}
.tl li button[aria-current=true]:before{content:"";position:absolute;left:-10px;top:0;bottom:0;width:3px;background:var(--blue)}
.tl li button[aria-current=true] b{color:var(--blue)}
.nores{padding:1rem 0;color:var(--mute);font-size:.92rem}
@media(max-width:860px){
.ex{grid-template-columns:1fr;gap:1.2rem}
.tl{position:static}
.tl .lab{display:none}
.tl ul{display:flex;gap:.5rem;overflow-x:auto;max-height:none;scrollbar-width:none;padding-bottom:.2rem}.tl ul::-webkit-scrollbar{display:none}
.tl li{flex:0 0 auto}
.tl li button{display:block;border:1px solid var(--line);border-radius:999px;padding:.45rem .95rem;font-size:.86rem;white-space:nowrap;width:auto}
.tl li button b{display:none}
.tl li button:hover{padding-left:.95rem}
.tl li button[aria-current=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tl li button[aria-current=true]:before{display:none}
.tsearch{margin-top:0}}
/* detalle */
.det{min-width:0;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.det .kick{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--blue)}
.det h2{font-size:clamp(1.9rem,4.2vw,3rem);margin:.6rem 0 .9rem}
.det .tag{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:clamp(1.1rem,1.8vw,1.35rem);line-height:1.45;color:#3b4a58;margin:0 0 1.4rem;max-width:50ch}
.det .txt p{margin:0 0 1rem;font-size:1.06rem;line-height:1.8;color:#3c3c3c;max-width:68ch}
.det .note{margin:1.2rem 0;padding:1rem 1.2rem;background:var(--paper);border-left:3px solid var(--blue);font-size:.95rem;line-height:1.6;color:var(--mute);max-width:68ch}
.dh{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin:2.2rem 0 1rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.dh h3{font-size:clamp(1.3rem,2.4vw,1.7rem)}
.prog{font-size:.8rem;letter-spacing:.08em;color:var(--mute);font-weight:600}
.pbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:1.1rem}
.pbar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem}
.dc{border:1px solid var(--line);background:#fff;padding:1.2rem 1.2rem .6rem;border-radius:2px;min-width:0}
.dc h4{margin:0 0 .7rem;font:600 .74rem 'Source Sans 3';letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.dc ul{list-style:none;margin:0;padding:0}
.dc li{margin:0}
.dc li.sub{font-weight:600;color:var(--navy);padding:.4rem 0 .5rem;font-size:.95rem}
.dc li button{display:grid;grid-template-columns:22px 1fr;gap:.7rem;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.75rem 0;font-size:.97rem;line-height:1.5;color:var(--ink)}
.dc li:first-child button{border-top:0}
.dc li button i{width:20px;height:20px;border:1.5px solid #b4bec9;border-radius:50%;margin-top:.15rem;display:grid;place-items:center;transition:.2s}
.dc li button i:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0;transition:.2s}
.dc li button span{white-space:pre-line}.dc li button b{font-weight:600;color:var(--navy)}.dc .bs{margin:-.4rem 0 .7rem;font-size:.86rem;color:var(--mute)}.asks{display:flex;gap:.6rem;flex-wrap:wrap;margin:.4rem 0}.btn.ask{margin:.6rem 0 .4rem;padding:.8rem 1.3rem;font-size:.9rem}.det .txt b{font-weight:600;color:var(--navy)}
.dc li button[aria-pressed=true] i{background:var(--blue);border-color:var(--blue)}
.dc li button[aria-pressed=true] i:after{opacity:1}
.dc li button[aria-pressed=true] span,.dc li button[aria-pressed=true] b{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.dc .dn{margin:0 0 .8rem;padding-top:.7rem;border-top:1px solid var(--line);font-size:.88rem;line-height:1.55;color:var(--mute)}
.help{display:flex;gap:1rem;align-items:flex-start;border:1px dashed #b4bec9;padding:1.2rem 1.3rem;color:var(--ink)}
.help svg{flex:0 0 28px;width:28px;height:28px;stroke:var(--blue);fill:none;stroke-width:1.5}
.help p{margin:0;font-size:1rem;line-height:1.65}
.tools2{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.1rem}
.tools2 button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:.65rem 1.05rem;font-size:.84rem;font-weight:600;letter-spacing:.04em;border-radius:2px;transition:.2s}
.tools2 button:hover{border-color:var(--blue);color:var(--blue)}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.pn button{border:0;background:none;color:var(--blue);font-weight:600;font-size:.92rem;padding:0;text-align:left;max-width:48%}
.pn button small{display:block;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem;color:var(--mute);margin-bottom:.2rem}
.pn button:last-child{text-align:right;margin-left:auto}
.cta{position:relative;isolation:isolate;overflow:hidden;background:var(--navy);color:#fff;padding:clamp(1.6rem,4vw,2.4rem);margin-top:2.4rem;display:flex;gap:1.2rem 2rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h3{color:#fff;font-size:clamp(1.3rem,2.4vw,1.75rem);max-width:24ch}
.cta p{margin:.5rem 0 0;color:rgba(255,255,255,.78);font-size:.96rem;max-width:46ch}
.cta .ct{display:flex;flex-direction:column;gap:.6rem;align-items:flex-start}
.cta a.t{color:#fff;font-weight:600;text-decoration:none;font-size:1.1rem}
.btn.wh{background:#fff;color:var(--navy)}.btn.wh:hover{background:var(--sky);transform:translateY(-2px)}
/* proceso */
.proc{background:var(--paper);padding-block:clamp(2.4rem,5vw,4rem)}
.proc h2{font-size:clamp(1.8rem,3.4vw,2.6rem);margin:.6rem 0 1.6rem}
.p3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.p3 div{background:#fff;border:1px solid var(--line);padding:1.4rem 1.3rem}
.p3 b{font:500 2.2rem 'Libre Caslon Text',serif;color:var(--blue);line-height:1}
.p3 h3{font-size:1.25rem;margin:.6rem 0 .4rem}.p3 p{margin:0;font-size:.95rem;line-height:1.6;color:var(--mute)}
@media(max-width:700px){.p3{grid-template-columns:1fr}.p3 div{display:grid;grid-template-columns:2rem 1fr;gap:.2rem .8rem}.p3 b{font-size:1.6rem;grid-row:span 2}.p3 h3{margin:0}}
/* otros */
.more{padding-block:clamp(2.4rem,5vw,4rem)}
.more h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:.5rem 0 1.4rem}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.mg a{display:flex;align-items:center;gap:.8rem;border:1px solid var(--line);padding:.8rem 1rem;text-decoration:none;color:var(--navy);font-weight:500;transition:.25s;background:#fff}
.mg a:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 14px 24px -18px rgba(0,32,52,.5)}
.mg img{width:38px;height:38px;object-fit:contain}.mg svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:1.4}
/* índice */
.mast{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(60% 90% at 90% 0,rgba(12,77,162,.55),transparent 70%),linear-gradient(165deg,#002034,#06304f);color:#fff;padding:calc(74px + clamp(2.4rem,5vw,4rem)) 0 clamp(2.2rem,4vw,3.4rem)}
.mast .eyebrow{color:var(--sky)}
.mast h1{color:#fff;font-size:clamp(2.5rem,7vw,5rem);margin:.7rem 0 .8rem;letter-spacing:-.01em}.mast h1 em{font-style:italic}
.mast:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--mb) center 40%/cover}.mast:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(95deg,rgba(0,24,40,.94),rgba(0,32,52,.72) 55%,rgba(0,32,52,.5))}
.mast p.lede{max-width:50ch;margin:0;color:rgba(255,255,255,.82);font-size:clamp(1.02rem,1.5vw,1.2rem)}
.gs{position:relative;margin-top:clamp(1.6rem,3vw,2.4rem);max-width:640px}
.gs svg{position:absolute;left:1rem;top:50%;width:19px;height:19px;transform:translateY(-50%);stroke:var(--mute);fill:none;stroke-width:1.8;pointer-events:none}
.gs input{width:100%;height:54px;border:0;border-radius:2px;padding:0 1rem 0 2.9rem;font:400 1.02rem 'Source Sans 3',sans-serif;color:var(--navy);background:#fff}
.gs input:focus{outline:none;box-shadow:0 0 0 3px rgba(111,163,230,.55)}
.gs input::-webkit-search-cancel-button{-webkit-appearance:none}
.res{background:#fff;color:var(--ink);margin-top:.5rem;max-width:640px;border-radius:2px;overflow:hidden;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.res a{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 1rem;text-decoration:none;color:var(--navy);border-bottom:1px solid var(--line);font-size:.97rem}
.res a:hover{background:var(--paper);color:var(--blue)}
.res a small{color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-size:.68rem;font-weight:600;align-self:center;white-space:nowrap}
.res p{margin:0;padding:1rem;color:var(--mute)}
mark{background:rgba(12,77,162,.14);color:inherit}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1.2rem;padding-block:clamp(2rem,4.5vw,3.4rem) clamp(3rem,6vw,5rem)}
.sc{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);background:#fff;text-decoration:none;color:inherit;overflow:hidden;transition:.3s}
.sc:hover{transform:translateY(-5px);box-shadow:0 28px 40px -28px rgba(0,32,52,.55);border-color:#c9d3de}
.sc .ph{position:relative;aspect-ratio:16/9;background:var(--navy) center/cover}
.sc .ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,24,40,.65))}
.sc .ph img{position:absolute;z-index:2;right:14px;bottom:-22px;width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4));transition:transform .4s}
.sc:hover .ph img{transform:translateY(-6px) scale(1.06)}
.sc .ph svg{position:absolute;z-index:2;right:16px;bottom:-14px;width:64px;stroke:#fff;fill:none;stroke-width:1.2}
.sc .bd{padding:1.5rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.sc .n{font:600 .7rem 'Source Sans 3';letter-spacing:.2em;color:var(--blue)}
.sc h3{font-size:1.5rem}
.sc p{margin:0;font-size:.95rem;line-height:1.6;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc .ft2{margin-top:auto;padding-top:.6rem;display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--blue);letter-spacing:.04em}
.sc .ft2:after{content:"→";transition:transform .25s}.sc:hover .ft2:after{transform:translateX(5px)}
%%FOOTCSS%%

/* menú móvil */
.mbtn{display:none;width:46px;height:46px;border:0;background:transparent;color:#fff;cursor:pointer;margin-right:-8px;position:relative;flex:none}
.mbtn i{position:absolute;left:12px;right:12px;height:1.5px;background:#fff;transition:transform .35s,opacity .2s,top .35s}
.mbtn i:nth-child(1){top:16px}.mbtn i:nth-child(2){top:22px}.mbtn i:nth-child(3){top:28px}
.mo .mbtn i:nth-child(1){top:22px;transform:rotate(45deg)}.mo .mbtn i:nth-child(2){opacity:0}.mo .mbtn i:nth-child(3){top:22px;transform:rotate(-45deg)}
#mm{position:fixed;inset:0;z-index:19;background:#001a2b;display:flex;flex-direction:column;justify-content:center;gap:.2rem;padding:calc(90px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.mo #mm{opacity:1;visibility:visible}
#mm a{font-family:'Libre Caslon Text',serif;color:#fff;text-decoration:none;font-size:clamp(1.7rem,7.5vw,2.3rem);padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:center;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
#mm a:after{content:"→";font-family:'Source Sans 3',sans-serif;font-size:1.1rem;color:var(--sky,#6fa3e6)}
.mo #mm a{opacity:1;transform:none}
.mo #mm a:nth-child(2){transition-delay:.05s}.mo #mm a:nth-child(3){transition-delay:.1s}.mo #mm a:nth-child(4){transition-delay:.15s}.mo #mm a:nth-child(5){transition-delay:.2s}
#mm a.cta{margin-top:1.6rem;border:1px solid rgba(255,255,255,.4);justify-content:center;font:600 1rem 'Source Sans 3',sans-serif;letter-spacing:.06em;padding:1rem}
#mm a.cta:after{content:none}
.mo{overflow:hidden}.mo header{background:#001a2b!important;box-shadow:none!important}
@media(max-width:900px){.mbtn{display:block}}
@media(min-width:901px){#mm{display:none}}

.wq{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin:0 0 .9rem}
.wl{font:600 .72rem 'Source Sans 3';letter-spacing:.18em;text-transform:uppercase;color:var(--mute);min-width:7.5rem}
.seg{display:inline-flex;background:#eef1f5;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:.55rem 1.15rem;font:600 .88rem 'Source Sans 3';color:var(--navy);cursor:pointer;transition:.25s}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;box-shadow:0 6px 14px -8px rgba(0,32,52,.6)}
.docs.wzd{grid-template-columns:1fr;gap:.8rem;margin-top:1.1rem;max-width:820px}
.wzd .dc[hidden]{display:none}
.wzd .dc{padding:0}
.wzd .dc>h4,.wzd .dc>.acc{margin:0;padding:1.05rem 1.2rem}
.wzd .dc>.acc{width:100%;display:flex;align-items:center;gap:.8rem;background:none;border:0;text-align:left;font:600 .74rem 'Source Sans 3';letter-spacing:.18em;text-transform:uppercase;color:var(--blue);cursor:pointer}
.wzd .acc .ct2{margin-left:auto;font-weight:500;letter-spacing:.06em;color:var(--mute);text-transform:none;font-size:.82rem}
.wzd .acc:after{content:"";width:9px;height:9px;border-right:1.5px solid var(--navy);border-bottom:1.5px solid var(--navy);transform:rotate(45deg);transition:.25s;margin:-4px 2px 0 .2rem}
.wzd .dc.col .acc:after{transform:rotate(-45deg);margin-top:0}
.wzd .dc.col .dcb{display:none}
.wzd .dcb{padding:0 1.2rem .6rem}
.wzd .dc .bs{margin:-.5rem 1.2rem .7rem}
.wzd .dcb .dn{margin-top:.2rem}
.tg{display:inline-block;margin:0 0 .75rem 2.1rem;font:600 .66rem 'Source Sans 3';letter-spacing:.14em;text-transform:uppercase;color:var(--blue);background:#e8f0fb;border-radius:999px;padding:.2rem .6rem;position:relative;top:-.45rem}
